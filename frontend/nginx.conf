server {
    listen 80;
    server_name _;

    # Import de datos: el .xlsb puede pesar ~150 MB. Subirlo en un solo POST.
    client_max_body_size 512M;
    client_body_timeout 600s;
    client_header_timeout 60s;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Compresion ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    # ---------- SPA fallback ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Proxy al backend Go ----------
    # NOTA: usamos "btr-backend" (el container_name) en vez de "backend" (el
    # nombre del servicio en el compose). En docker-compose local ambos resuelven,
    # pero en Dokploy el servicio `backend` no siempre queda como alias DNS en la
    # red project, y el container queda registrado solo con su container_name.
    # Esto causaba 502 Bad Gateway en /api/* (el backend directo por su dominio
    # propio funcionaba, pero el proxy interno del frontend no).
    location /api/ {
        proxy_pass http://btr-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # La importacion sube archivos grandes y tarda en responder: ampliar.
        client_max_body_size 512M;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Sin cache en respuestas de API
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store";
    }

    # ---------- Health del frontend ----------
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------- Assets con cache ----------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}